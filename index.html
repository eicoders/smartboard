<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Board | JarFanmade</title>

    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <canvas id="smartBoard"></canvas>

    <div class="toolbar">
        <div class="tool-section">
            <input type="color" id="colorPicker" value="#000000" title="Pen Color">
            <input type="range" id="lineWidth" min="1" max="30" value="4" title="Thickness">
        </div>

        <div class="divider"></div>

        <div class="tool-section">
            <button class="tool-btn active" data-tool="pen" title="Pen"><i class="fas fa-pen"></i></button>
            <button class="tool-btn" data-tool="eraser" title="Eraser"><i class="fas fa-eraser"></i></button>
        </div>

        <div class="divider"></div>

        <div class="tool-section">
            <button class="tool-btn shape-btn" data-tool="line" title="Line"><i class="fas fa-slash"></i></button>
            <button class="tool-btn shape-btn" data-tool="rect" title="Rectangle"><i class="far fa-square"></i></button>
            <button class="tool-btn shape-btn" data-tool="circle" title="Circle"><i class="far fa-circle"></i></button>
        </div>

        <div class="divider"></div>

        <div class="tool-section">
            <button id="undoBtn" class="action-btn" title="Undo"><i class="fas fa-undo"></i></button>
            <button id="redoBtn" class="action-btn" title="Redo"><i class="fas fa-redo"></i></button>
            <button id="clearBtn" class="action-btn danger" title="Clear Board"><i class="fas fa-trash-alt"></i></button>
        </div>

        <div class="divider"></div>

        <div class="tool-section">
            <button id="fullscreenBtn" class="action-btn" title="Full Screen"><i class="fas fa-expand"></i></button>
            <button id="downloadBtn" class="action-btn success" title="Save Board"><i class="fas fa-download"></i></button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
